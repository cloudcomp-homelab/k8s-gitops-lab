# ============================================================
# CLUSTERPOLICY - REQUIRE REQUESTS AND LIMITS
# Every container must declare CPU/memory requests and a
# memory limit, so one workload cannot starve the node.
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must declare CPU and memory requests and a memory
      limit, to protect the node from resource exhaustion.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  background: true
  rules:
    - name: validate-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        failureAction: Audit
        message: "CPU and memory requests and a memory limit are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"