# ============================================================
# POLICYEXCEPTION - NODE EXPORTER
# node-exporter reads metrics directly from the host (/proc,
# /sys, network stack). It needs hostNetwork, hostPID, hostPath
# and its hostPort by design. Scoped to exactly these policies
# and only to node-exporter in the monitoring namespace.
# ============================================================
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-node-exporter
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  policyRefs:
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy

  # Only node-exporter in the monitoring namespace
  matchConditions:
    - name: node-exporter-in-monitoring
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] == 'prometheus-node-exporter'

  # Show as "skip" in PolicyReports, so the exception stays visible
  reportResult: skip

  properties:
    reason: node-exporter collects host metrics and needs hostNetwork, hostPID, hostPath and hostPort
    scope: monitoring/prometheus-node-exporter
    approved-by: platform-team
