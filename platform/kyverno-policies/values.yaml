# ============================================================
# KYVERNO POLICIES - HELM VALUES
# Official Kubernetes Pod Security Standards (PSS)
# ============================================================

# "baseline" blocks known privilege escalations (privileged
# containers, host namespaces, hostPath, ...). "restricted" is
# stricter and is the next step once all workloads comply.
podSecurityStandard: baseline

# Block violations. Required exceptions are declared explicitly
# as PolicyExceptions in manifests/.
validationFailureAction: Enforce

# If Kyverno is unavailable, do not block the cluster
failurePolicy: Ignore