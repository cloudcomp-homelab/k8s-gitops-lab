# ============================================================
# HTTPROUTE - GRAFANA (HTTPS)
# https://grafana.localhost -> kube-prometheus-stack-grafana
# All API defaults are written out explicitly so Git matches
# the live object exactly (no OutOfSync drift).
# ============================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: traefik
      sectionName: websecure-grafana
  hostnames:
    - grafana.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1