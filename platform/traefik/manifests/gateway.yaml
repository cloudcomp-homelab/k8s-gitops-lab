# ============================================================
# GATEWAY - MAIN ENTRY POINT
# The "front door" of the cluster. Apps attach to it with an
# HTTPRoute in their own namespace.
# cert-manager issues a certificate for every HTTPS listener.
# ============================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: traefik
  annotations:
    # The Gateway API CRDs are installed in the same sync
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # cert-manager: sign HTTPS listener certificates with the lab CA
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP - only used to redirect to HTTPS
    - name: web
      protocol: HTTP
      # Port of Traefik's "web" entry point (exposed as 80)
      port: 8000
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS - Argo CD
    - name: websecure-argocd
      protocol: HTTPS
      # Port of Traefik's "websecure" entry point (exposed as 443)
      port: 8443
      hostname: argocd.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-localhost-tls
      allowedRoutes:
        namespaces:
          from: All