# ============================================================
# HTTPROUTE - ARGO CD (HTTPS)
# https://argocd.localhost -> argocd-server
# All API defaults are written out explicitly so Git matches
# the live object exactly (no OutOfSync drift).
# ============================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # The Gateway API CRDs are installed by Traefik (sync wave 1)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: traefik
      sectionName: websecure-argocd
  hostnames:
    - argocd.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
