# ============================================================
# HTTPROUTE - ARGO CD
# http://argocd.localhost -> argocd-server
# ============================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # The Gateway API CRDs are installed by Traefik (sync wave 1)
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: main-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - argocd.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80