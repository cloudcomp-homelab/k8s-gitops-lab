# ============================================================
# CLUSTERISSUER - LAB CA
# Signs all certificates in the cluster with the lab root CA.
# This is the issuer that Gateways and apps refer to.
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: lab-root-ca